<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quarter 2 - Woven Arts</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root{
  --red:#7b1d1d;
  --gold:#e7c16f;
  --dark:#1a1a1a;
  --cream:#fff6e8;
}

*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Poppins',sans-serif;
  background:#fffaf3;
  color:var(--dark);
  overflow-x:hidden;
  position:relative;
}

/* SPARKLES */
.star{
  position:absolute;
  width:4px;height:4px;
  background:var(--gold);
  border-radius:50%;
  opacity:.8;
  animation:sparkle 3s linear infinite;
}
@keyframes sparkle{
  0%{transform:translateY(0);}
  50%{transform:translateY(-50px);opacity:.4;}
  100%{transform:translateY(0);}
}

/* NAVBAR */
nav{
  position:sticky;
  top:0;
  z-index:1000;
  background:linear-gradient(135deg,#7b1d1d,#a83232,#e7c16f);
  padding:18px 24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  box-shadow:0 10px 30px rgba(0,0,0,.25);
}
nav h1{
  font-family:'Playfair Display',serif;
  font-size:clamp(20px,5vw,28px);
  color:#fff;
  letter-spacing:2px;
}
.nav-links{
  display:flex;
  gap:22px;
}
.nav-links a{
  color:#fff;
  text-decoration:none;
  font-size:14px;
  letter-spacing:1px;
  position:relative;
}
.nav-links a:hover::after{
  content:'';
  position:absolute;
  left:0;
  bottom:-4px;
  width:100%;
  height:2px;
  background:var(--gold);
}
.hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;}
.hamburger div{width:28px;height:3px;background:#fff;}

/* HERO */
.hero{
  text-align:center;
  padding:90px 20px 70px;
  background:linear-gradient(-45deg,#fff1df,#fffaf3,#ffe6c7,#fffaf3);
  background-size:400% 400%;
  animation:bgShift 15s ease infinite;
}
@keyframes bgShift{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}
.hero h2{
  font-family:'Playfair Display',serif;
  font-size:clamp(36px,8vw,64px);
  color:var(--red);
}
.hero span{color:var(--gold);}
.hero p{
  max-width:720px;
  margin:16px auto 0;
  font-size:clamp(14px,4vw,18px);
  text-align:center;
}

/* CATEGORY CARDS */
.categories{
  max-width:1100px;
  margin:60px auto 100px;
  padding:0 20px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:60px;
}
.cat-card{
  background:#fff;
  padding:16px;
  border-radius:12px;
  box-shadow:0 20px 45px rgba(0,0,0,.18);
  cursor:pointer;
  transition:.4s;
  position:relative;
}
.cat-card:hover{
  transform:scale(1.05);
  box-shadow:0 30px 60px rgba(255,194,113,.35);
}
.cat-card img{
  width:100%;
  border-radius:8px;
}
.cat-card h3{
  margin-top:14px;
  font-family:'Playfair Display',serif;
  color:var(--red);
  font-size:20px;
  text-align:center;
}
.cat-card p{
  margin-top:10px;
  font-size:14px;
  color:var(--dark);
  text-align:center;
}

/* FOOTER */
footer{
  text-align:center;
  padding:26px 16px;
  font-size:13px;
  background:#7b1d1d;
  color:#fff;
}

/* RESPONSIVE */
@media(max-width:768px){
  .nav-links{display:none;flex-direction:column;width:100%;margin-top:10px;}
  .nav-links.active{display:flex;}
  .hamburger{display:flex;}
}
</style>
</head>

<body>

<div id="sparkles"></div>

<nav>
  <h1>Woven Arts</h1>
  <div class="hamburger" id="hamburger">
    <div></div><div></div><div></div>
  </div>
  <div class="nav-links" id="nav-links">
    <a href="index.html">Home</a>
    <a href="q1.html">Quarter 1</a>
    <a href="q2.html">Quarter 2</a>
    <a href="q3.html">Quarter 3</a>
  </div>
</nav>

<section class="hero">
  <h2>Quarter 2 <span>Works</span></h2>
  <p>Poster/digital presentations of Southeast Asian documentary or animated films, together with final output group projects.</p>
</section>

<section class="categories">

  <div class="cat-card" id="poster-card">
    <img src="poster.jpg" alt="Poster Placeholder">
    <h3>Poster / Digital Presentation</h3>
    <p></p>
  </div>

  <div class="cat-card" id="output-card">
    <img src="Q2_image2.png" alt="Final Output Placeholder">
    <h3>Final Output Presentation</h3>
    <p></p>
  </div>

</section>

<footer>© 2026 National Arts Month • Section ONL 8-1 Exhibit</footer>

<script>
const ham=document.getElementById('hamburger');
const nav=document.getElementById('nav-links');
ham.onclick=()=>nav.classList.toggle('active');

const sparkles=document.getElementById('sparkles');
for(let i=0;i<50;i++){
  const s=document.createElement('div');
  s.className='star';
  s.style.left=Math.random()*100+'vw';
  s.style.top=Math.random()*100+'vh';
  s.style.animationDuration=(Math.random()*3+2)+'s';
  sparkles.appendChild(s);
}

const posterFile = "Adarna Poster_Q2.png";
const posterCaption = "In a kingdom shadowed by jealousy, pride, greed, and betrayal, not all sickness could be seen. The Ibong Adarna perched in the darkness, its song testing truth and character. Only those patient, humble, kind, and with integrity could cross from shadow to light, discovering that real healing begins not with magic, but with a heart that chooses goodness.";

const outputFile = "Output_Q2.mp4";

const posterCard = document.getElementById('poster-card');
const outputCard = document.getElementById('output-card');

posterCard.addEventListener('click',()=>{
  const existingImg = posterCard.querySelector('img.poster-content');
  const existingCap = posterCard.querySelector('.poster-detail');

  if(existingImg){
    existingImg.remove();
    if(existingCap) existingCap.remove();
    posterCard.querySelector('img').style.display='block';
    return;
  }

  posterCard.querySelector('img').style.display='none';

  const img = document.createElement('img');
  img.src = posterFile;
  img.className = 'poster-content';
  img.style.borderRadius='8px';
  posterCard.appendChild(img);

  const cap = document.createElement('p');
  cap.className = 'poster-detail';
  cap.textContent = posterCaption;
  posterCard.appendChild(cap);

  img.scrollIntoView({behavior:'smooth', block:'center'});
});

outputCard.addEventListener('click',()=>{
  const existingVideo = outputCard.querySelector('video');

  if(existingVideo){
    existingVideo.remove();
    outputCard.querySelector('img').style.display='block';
    return;
  }

  outputCard.querySelector('img').style.display='none';

  const vid = document.createElement('video');
  vid.controls = true;
  vid.style.borderRadius = '8px';
  vid.style.width = '100%';
  vid.style.maxHeight = '360px';
  vid.style.objectFit = 'cover';

  const source = document.createElement('source');
  source.src = outputFile;
  source.type = "video/mp4";
  vid.appendChild(source);

  outputCard.appendChild(vid);

  vid.scrollIntoView({behavior:'smooth', block:'center'});
});
</script>

</body>
</html>
